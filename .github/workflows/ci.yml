name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: fmt, clippy, workspace tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install nats-server (bus tests require the binary)
        run: |
          curl -fsSL "https://github.com/nats-io/nats-server/releases/download/v2.10.22/nats-server-v2.10.22-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin --strip-components=1 --wildcards '*/nats-server'
          nats-server --version

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Workspace tests
        run: cargo test --workspace

  containerd:
    name: Daemon-backed tests (never silently skipped)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install containerd
        run: |
          # shortcut: when the runner cannot reach the Ubuntu archive, use the
          # containerd the runner image already ships; remove once apt is reliable.
          if ! (sudo apt-get update && sudo apt-get install -y containerd); then
            echo "::warning::apt install failed; using the runner image's containerd"
          fi
          sudo systemctl start containerd
          containerd --version

      - name: Preload images into the minga namespace
        run: |
          sudo ctr -n minga images pull docker.io/library/redis:8.10.2-alpine
          sudo ctr -n minga images pull docker.io/library/busybox:latest
          sudo ctr -n minga images pull docker.io/library/nginx:1.27

      - name: Private registry (registry:2, htpasswd, TLS) with one seeded image
        run: |
          # containerd's Transfer API cannot be told to use plain HTTP, so the
          # registry serves a self-signed cert that containerd and docker trust.
          mkdir -p "$RUNNER_TEMP/registry"
          cd "$RUNNER_TEMP/registry"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -keyout registry.key -out registry.crt \
            -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
          sudo cp registry.crt /usr/local/share/ca-certificates/minga-test-registry.crt
          sudo update-ca-certificates
          sudo mkdir -p /etc/docker/certs.d/localhost:5000
          sudo cp registry.crt /etc/docker/certs.d/localhost:5000/ca.crt
          # docker depends on containerd and is not brought back by itself: restart both.
          sudo systemctl restart containerd docker
          for _ in $(seq 1 60); do
            # not `docker info`: it exits 1 on the runner even when the daemon is up
            docker ps >/dev/null 2>&1 && sudo ctr version >/dev/null 2>&1 && break
            sleep 1
          done
          docker ps >/dev/null

          password="$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          docker run --rm --entrypoint htpasswd httpd:2 -Bbn minga "$password" > htpasswd
          docker run -d --name registry -p 127.0.0.1:5000:5000 \
            -v "$PWD/htpasswd:/auth/htpasswd:ro" -v "$PWD:/certs:ro" \
            -e REGISTRY_AUTH=htpasswd -e REGISTRY_AUTH_HTPASSWD_REALM=minga \
            -e REGISTRY_AUTH_HTPASSWD_PATH=/auth/htpasswd \
            -e REGISTRY_HTTP_TLS_CERTIFICATE=/certs/registry.crt \
            -e REGISTRY_HTTP_TLS_KEY=/certs/registry.key \
            registry:2
          sleep 3
          echo "$password" | docker login localhost:5000 -u minga --password-stdin
          docker pull busybox:latest
          docker tag busybox:latest localhost:5000/minga/private:1
          docker push localhost:5000/minga/private:1
          {
            echo "MINGA_TEST_REGISTRY_IMAGE=localhost:5000/minga/private:1"
            echo "MINGA_TEST_REGISTRY_USER=minga"
            echo "MINGA_TEST_REGISTRY_PASSWORD=$password"
          } >> "$GITHUB_ENV"

      - name: Daemon-backed suites (fail closed when the daemon is absent)
        run: sudo -E env "PATH=$PATH" MINGA_REQUIRE_CONTAINERD=1 cargo test -p minga-node --test containerd --test containerd_client --test containerd_pull

  netns:
    name: Published-port paths on a real kernel (never silently skipped)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Network-namespace suite (fails closed when it cannot run)
        run: sudo -E env "PATH=$PATH" MINGA_REQUIRE_NETNS=1 cargo test -p minga-node --test netns -- --nocapture
