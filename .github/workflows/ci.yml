name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI only reads the repository. Actions are pinned to full commit SHAs.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: fmt, clippy, workspace tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install nats-server (bus tests require the binary)
        run: |
          curl -fsSL "https://github.com/nats-io/nats-server/releases/download/v2.10.22/nats-server-v2.10.22-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin --strip-components=1 --wildcards '*/nats-server'
          nats-server --version

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Workspace tests
        run: cargo test --workspace

  containerd:
    name: Daemon-backed tests (never silently skipped)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install containerd
        run: |
          # shortcut: when the runner cannot reach the Ubuntu archive, use the
          # containerd the runner image already ships; remove once apt is reliable.
          if ! (sudo apt-get update && sudo apt-get install -y containerd); then
            echo "::warning::apt install failed; using the runner image's containerd"
          fi
          sudo systemctl start containerd
          containerd --version

      - name: Preload images into the minga namespace
        run: |
          sudo ctr -n minga images pull docker.io/library/redis:8.10.2-alpine
          sudo ctr -n minga images pull docker.io/library/busybox:latest
          sudo ctr -n minga images pull docker.io/library/nginx:1.27

      - name: Private registry (distribution, htpasswd, TLS) with one seeded image
        run: |
          # Installing containerd above removed the runner's docker-ce, so the
          # registry is the distro package, not a container. containerd's
          # Transfer API cannot be told to use plain HTTP (1.7 has no such
          # field), so it serves TLS with a self-signed cert the daemon trusts.
          sudo apt-get install -y docker-registry apache2-utils skopeo
          sudo systemctl disable --now docker-registry
          mkdir -p "$RUNNER_TEMP/registry"
          cd "$RUNNER_TEMP/registry"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -keyout registry.key -out registry.crt \
            -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
          sudo cp registry.crt /usr/local/share/ca-certificates/minga-test-registry.crt
          sudo update-ca-certificates
          sudo systemctl restart containerd

          password="$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          htpasswd -Bbn minga "$password" > htpasswd
          cat > config.yml <<EOF
          version: 0.1
          storage:
            filesystem:
              rootdirectory: $PWD/data
          http:
            addr: 127.0.0.1:5000
            tls:
              certificate: $PWD/registry.crt
              key: $PWD/registry.key
          auth:
            htpasswd:
              realm: minga
              path: $PWD/htpasswd
          EOF
          nohup docker-registry serve config.yml > registry.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -s -o /dev/null --cacert registry.crt https://localhost:5000/v2/ && break
            sleep 1
          done
          curl -s -o /dev/null -w 'anonymous /v2/ -> %{http_code}\n' --cacert registry.crt https://localhost:5000/v2/

          # Seed a single-platform copy of busybox. (skopeo takes the login as an
          # argument: fine for a throwaway masked password on an ephemeral runner.)
          skopeo copy --dest-creds "minga:$password" \
            docker://docker.io/library/busybox:latest docker://localhost:5000/minga/private:1
          {
            echo "MINGA_TEST_REGISTRY_IMAGE=localhost:5000/minga/private:1"
            echo "MINGA_TEST_REGISTRY_USER=minga"
            echo "MINGA_TEST_REGISTRY_PASSWORD=$password"
          } >> "$GITHUB_ENV"

      - name: Daemon-backed suites (fail closed when the daemon is absent)
        run: sudo -E env "PATH=$PATH" MINGA_REQUIRE_CONTAINERD=1 cargo test -p minga-node --test containerd --test containerd_client --test containerd_pull

  netns:
    name: Published-port paths on a real kernel (never silently skipped)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Network-namespace suite (fails closed when it cannot run)
        run: sudo -E env "PATH=$PATH" MINGA_REQUIRE_NETNS=1 cargo test -p minga-node --test netns -- --nocapture
