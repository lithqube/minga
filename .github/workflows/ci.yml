name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI only reads the repository. Actions are pinned to full commit SHAs.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: fmt, clippy, workspace tests
    strategy:
      matrix:
        include: &current-nats
          # SHA-256 from the release SHA256SUMS; matches release.yml.
          - &current-nats-pin
            nats-version: v2.15.3
            nats_sha256: 32e18c1e78d7ef4f86e483070eef3abb2647c3d4d67e29668077c7ad81da0797
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # The release workflow runs this script on each archive; prove here that
      # it still rejects an archive without minga-ctl (#206).
      - name: Release archive check rejects a missing minga-ctl
        run: |
          d=$(mktemp -d)
          (cd "$d" && touch minga minga-ctl nats-server ctr NATS-LICENSE install.sh LICENSE minga.service minga.env.example)
          tar -C "$d" -czf "$d/good.tar.gz" minga minga-ctl nats-server ctr NATS-LICENSE install.sh LICENSE minga.service minga.env.example
          tar -C "$d" -czf "$d/bad.tar.gz" minga nats-server ctr NATS-LICENSE install.sh LICENSE minga.service minga.env.example
          sh scripts/check-release-archive.sh "$d/good.tar.gz"
          if sh scripts/check-release-archive.sh "$d/bad.tar.gz"; then echo "::error::check accepted an archive without minga-ctl"; exit 1; fi

      - name: Install nats-server (bus tests require the binary)
        env:
          NATS_VERSION: ${{ matrix.nats-version }}
        run: |
          archive="nats-server-${NATS_VERSION}-linux-amd64.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/nats-io/nats-server/releases/download/${NATS_VERSION}/$archive"
          echo "${{ matrix.nats_sha256 }}  $archive" | sha256sum -c -
          sudo tar -xzf "$archive" -C /usr/local/bin --strip-components=1 --wildcards '*/nats-server'
          nats-server --version

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Workspace tests
        run: cargo test --workspace
  nats:
    name: NATS suites (never silently skipped)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # nats_sha256: from each release's SHA256SUMS, pinned so a
          # replaced archive fails before it is extracted.
          - nats-version: v2.14.10
            nats_sha256: 464f118a8aecf293e405514c1ab2c197a5d9209e58e36a5d05ad9577e5ee9b99
          - *current-nats-pin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install nats-server ${{ matrix.nats-version }}
        env:
          NATS_VERSION: ${{ matrix.nats-version }}
        run: |
          archive="nats-server-${NATS_VERSION}-linux-amd64.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/nats-io/nats-server/releases/download/${NATS_VERSION}/$archive"
          echo "${{ matrix.nats_sha256 }}  $archive" | sha256sum -c -
          sudo tar -xzf "$archive" -C /usr/local/bin --strip-components=1 --wildcards '*/nats-server'
          nats-server --version

      - name: Start single-node JetStream server
        run: |
          nohup nats-server -js -p 4222 -m 8222 > "$RUNNER_TEMP/nats-server.log" 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:8222/healthz?js-enabled-only=true" >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS "http://127.0.0.1:8222/healthz?js-enabled-only=true"
          {
            echo "MINGA_TEST_NATS_URL=nats://127.0.0.1:4222"
            echo "MINGA_REQUIRE_NATS=1"
            echo "MINGA_NATS_SERVER_BIN=/usr/local/bin/nats-server"
          } >> "$GITHUB_ENV"

      - name: NATS integration suites (fail closed)
        run: cargo test -p minga-bus

  nats-upgrade:
    name: NATS store upgrade 2.10.22 to ${{ matrix.nats-version }} (plan 14-04)
    strategy:
      matrix:
        include: *current-nats
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Fetch and verify both nats-server versions
        # Checksums from each release's SHA256SUMS (2.15.3 matches release.yml).
        run: |
          fetch() {
            local archive="nats-server-$1-linux-amd64.tar.gz"
            curl -fsSL -o "$archive" "https://github.com/nats-io/nats-server/releases/download/$1/$archive"
            echo "$2  $archive" | sha256sum -c -
            mkdir -p "nats-$1"
            tar -C "nats-$1" -xzf "$archive" --strip-components=1 --wildcards '*/nats-server'
            "nats-$1/nats-server" --version
          }
          fetch v2.10.22 db0b3ccbe4cbdd3872ae7486ec4f6b0f85824632a0789f4da2e0a8518390483e
          fetch "${{ matrix.nats-version }}" "${{ matrix.nats_sha256 }}"

      - name: Single-server and rolling three-server upgrade
        run: scripts/nats-upgrade-proof.sh nats-v2.10.22/nats-server nats-${{ matrix.nats-version }}/nats-server all

  containerd:
    name: Daemon-backed tests (never silently skipped)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install containerd
        run: |
          # shortcut: when the runner cannot reach the Ubuntu archive, use the
          # containerd the runner image already ships; remove once apt is reliable.
          if ! (sudo apt-get update && sudo apt-get install -y containerd); then
            echo "::warning::apt install failed; using the runner image's containerd"
          fi
          sudo systemctl start containerd
          containerd --version

      - name: Preload images into the minga namespace
        run: |
          sudo ctr -n minga images pull docker.io/library/redis:8.10.2-alpine
          sudo ctr -n minga images pull docker.io/library/busybox:latest
          sudo ctr -n minga images pull docker.io/library/nginx:1.27

      - name: Private registry (distribution, htpasswd, TLS) with one seeded image
        run: |
          # Installing containerd above removed the runner's docker-ce, so the
          # registry is the distro package, not a container. containerd's
          # Transfer API cannot be told to use plain HTTP (1.7 has no such
          # field), so it serves TLS with a self-signed cert the daemon trusts.
          sudo apt-get install -y docker-registry apache2-utils skopeo
          sudo systemctl disable --now docker-registry
          mkdir -p "$RUNNER_TEMP/registry"
          cd "$RUNNER_TEMP/registry"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -keyout registry.key -out registry.crt \
            -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
          sudo cp registry.crt /usr/local/share/ca-certificates/minga-test-registry.crt
          sudo update-ca-certificates
          sudo systemctl restart containerd

          password="$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          htpasswd -Bbn minga "$password" > htpasswd
          cat > config.yml <<EOF
          version: 0.1
          storage:
            filesystem:
              rootdirectory: $PWD/data
          http:
            addr: 127.0.0.1:5000
            tls:
              certificate: $PWD/registry.crt
              key: $PWD/registry.key
          auth:
            htpasswd:
              realm: minga
              path: $PWD/htpasswd
          EOF
          nohup docker-registry serve config.yml > registry.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -s -o /dev/null --cacert registry.crt https://localhost:5000/v2/ && break
            sleep 1
          done
          curl -s -o /dev/null -w 'anonymous /v2/ -> %{http_code}\n' --cacert registry.crt https://localhost:5000/v2/

          # Seed a single-platform copy of busybox. (skopeo takes the login as an
          # argument: fine for a throwaway masked password on an ephemeral runner.)
          skopeo copy --dest-creds "minga:$password" \
            docker://docker.io/library/busybox:latest docker://localhost:5000/minga/private:1
          {
            echo "MINGA_TEST_REGISTRY_IMAGE=localhost:5000/minga/private:1"
            echo "MINGA_TEST_REGISTRY_USER=minga"
            echo "MINGA_TEST_REGISTRY_PASSWORD=$password"
          } >> "$GITHUB_ENV"

      - name: Daemon-backed suites (fail closed when the daemon is absent)
        run: sudo -E env "PATH=$PATH" MINGA_REQUIRE_CONTAINERD=1 cargo test -p minga-node --test containerd --test containerd_client --test containerd_pull

  netns:
    name: Overlay network paths on a real kernel (never silently skipped)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install WireGuard test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wireguard-tools iputils-ping kmod nftables
          sudo modprobe wireguard
          sudo modprobe br_netfilter
      - name: Network-namespace suite (fails closed when it cannot run)
        run: sudo -E env "PATH=$PATH" MINGA_REQUIRE_NETNS=1 cargo test -p minga-node --test netns --test wireguard_netns -- --nocapture
