name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build the release binary
        run: cargo build --release -p minga-cli --target ${{ matrix.target }}

      - name: Package
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/minga" dist/
          cp install.sh README.md LICENSE CHANGELOG.md dist/
          tar -C dist -czf "minga-${{ matrix.target }}.tar.gz" minga install.sh README.md LICENSE CHANGELOG.md

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            minga-${{ matrix.target }}.tar.gz
            install.sh
