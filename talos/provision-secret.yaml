# Provision one secret into Minga's node-local store on Talos.
#
# Talos has no shell, and Minga accepts no secret values over its API, so
# this Job writes the file with `minga secret put` from a Kubernetes Secret.
# SECRET_ID is `<stack>_<compose secret key>`, e.g. `shop_db_password`.
#
# Usage (delete the Kubernetes Secret afterwards so the value is only in the
# store):
#   kubectl -n kube-system create secret generic minga-secret-value \
#     --from-file=value=./secret-value
#   # set SECRET_ID below, then:
#   kubectl apply -f talos/provision-secret.yaml
#   kubectl -n kube-system wait --for=condition=complete job/minga-provision-secret
#   kubectl -n kube-system delete job/minga-provision-secret secret/minga-secret-value
#
# The value is written byte for byte: a trailing newline in the file stays.
# Multi-node: run once per node with a nodeSelector.
apiVersion: batch/v1
kind: Job
metadata:
  name: minga-provision-secret
  namespace: kube-system
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      tolerations:
        - operator: Exists
      containers:
        - name: put
          image: ghcr.io/lithqube/minga:latest
          command: ["/bin/sh", "-c"]
          args:
            - minga secret put "$SECRET_ID" --secret-store=/var/mnt/minga-state/secrets < /value/value
          env:
            - name: SECRET_ID
              value: shop_db_password
          securityContext:
            privileged: true
          volumeMounts:
            - name: value
              mountPath: /value
              readOnly: true
            - name: store
              mountPath: /var/mnt/minga-state
      volumes:
        - name: value
          secret:
            secretName: minga-secret-value
        - name: store
          hostPath:
            path: /var/mnt/minga-state
            type: Directory
