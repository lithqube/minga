[package]
name = "minga-telemetry"
version = "0.0.1"
edition = "2021"
description = "Observability for Minga: metrics, health endpoints, structured logging"
license = "MIT"

[dependencies]
axum = { workspace = true }
prometheus = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "json"] }
tracing-appender = "0.2"
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
http = "1.0"

[dev-dependencies]