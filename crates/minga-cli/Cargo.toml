[package]
name = "minga-cli"
description = "Minga single binary: manager, worker and CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "minga"
path = "src/main.rs"

[dependencies]
clap.workspace = true
minga-api = { path = "../minga-api" }
minga-bus = { path = "../minga-bus" }
minga-compose = { path = "../minga-compose" }
minga-egress = { path = "../minga-egress" }
ipnet.workspace = true
minga-net = { path = "../minga-net" }
minga-node = { path = "../minga-node" }
minga-sandbox = { path = "../minga-sandbox" }
minga-scheduler = { path = "../minga-scheduler" }
minga-state = { path = "../minga-state" }
minga-telemetry = { path = "../minga-telemetry" }
nats-jwt-rs.workspace = true
libc.workspace = true
rand.workspace = true
rcgen.workspace = true
rustls-pemfile.workspace = true
x509-parser = { workspace = true, features = ["verify"] }
time.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
futures.workspace = true
reqwest = { workspace = true, features = ["rustls-tls"] }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
async-nats.workspace = true
nkeys.workspace = true
tempfile.workspace = true
axum.workspace = true
tower.workspace = true
serde_json.workspace = true
